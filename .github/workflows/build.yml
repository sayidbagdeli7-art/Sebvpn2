name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on this runner)
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Download libv2ray.aar (Xray core) from latest AndroidLibXrayLite release
        run: |
          mkdir -p app/libs
          rm -f app/libs/PUT_libv2ray.aar_HERE.txt
          curl -L -f -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          ls -la app/libs/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        env:
          GIT_SHA: ${{ github.sha }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoVPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish "latest" release for in-app auto-update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          # This must exactly match BuildConfig.GIT_SHA (which is the FULL sha) or
          # the in-app update check will never see them as equal and will always
          # think an update is available, even right after installing the latest one.
          echo "$FULL_SHA" > version.txt
          cp app/build/outputs/apk/debug/app-debug.apk AutoVPN.apk

          # Remove any previous "latest" release + tag so we always end up with
          # exactly one release that the app's fixed download URL points to.
          gh release delete latest --yes --cleanup-tag || true

          gh release create latest \
            AutoVPN.apk version.txt \
            --title "Latest build ($SHORT_SHA)" \
            --notes "Automatically built from commit $SHORT_SHA" \
            --target "$FULL_SHA"
