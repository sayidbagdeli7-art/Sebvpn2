plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autovpn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.autovpn.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Baked in at build time by the GitHub Actions workflow (GIT_SHA env var) so
        // the app can tell whether a newer build exists on GitHub. Local builds that
        // don't set this env var just get "dev", which never matches a release.
        buildConfigField "String", "GIT_SHA", "\"${System.getenv('GIT_SHA') ?: 'dev'}\""
    }

    // Fixed debug-signing key committed to the repo (app/../debug.keystore) so every
    // build - whether from GitHub Actions or a local machine - is signed identically.
    // Without this, each CI run got a random new key and Android refused to install
    // the "update" over the previous copy (had to uninstall first every time).
    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Xray core wrapper -> download libv2ray.aar from:
    // https://github.com/2dust/AndroidLibXrayLite/releases
    // and place it in app/libs/libv2ray.aar
    implementation files('libs/libv2ray.aar')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
